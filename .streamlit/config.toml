# Project Sage — local Streamlit settings
# Port map (this machine): 8501 hyperliquid-bot, 8502 log-sage, 8503 net-comd-comp, 8504 Project Sage

[server]
port = 8504
headless = true
# OneDrive + Windows: native watchdog often access-violates under load.
# Disable Streamlit's source file watcher (restart app manually after code edits).
fileWatcherType = "none"

[logger]
level = "info"

[runner]
fastReruns = true
