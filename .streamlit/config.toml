# Project Sage — local Streamlit settings
# Port map (this machine): 8501 hyperliquid-bot, 8502 log-sage, 8503 net-comd-comp, 8504 Project Sage

[server]
port = 8504
# CODE-HOUSE Wi-Fi. Operator asked for LAN access from a laptop on 2026-09-27.
# The index can contain hyperliquid-bot\.env. Do not switch this to 0.0.0.0.
address = "10.0.0.201"
headless = true
# Streamlit SOURCE watcher only (app.py hot-reload) — NOT document auto-ingest.
# Project folder ingest is sage/watcher.py (poll-only on Windows). Keep this "none"
# on OneDrive to avoid native access violations; restart Streamlit after code edits.
fileWatcherType = "none"

[logger]
level = "info"

[runner]
fastReruns = true
